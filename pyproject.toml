[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ssa-pipeline"
version = "0.1.0"
description = "SSA satellite identification pipeline (FTP -> str -> TLE matching), CWD-based fixed filenames"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.20",
    "pandas>=1.3",
    "astropy>=5.0",
    "sgp4>=2.20",
]

# pip install -e . 하면 아래 명령어가 OS 무관하게 생긴다:
#   ftp2str   ->  현재 폴더의 raw FTP -> str.txt
#   str2tle   ->  현재 폴더의 site/str/catalog -> str_m.txt
#   ssa run   ->  ftp2str + str2tle
[project.scripts]
ftp2str = "ftp2str:run"
str2tle = "str2tle:run"
ssa = "main:main"

# 플랫(단일 파일) 모듈만 설치 대상으로 명시. config.py / classes/ 는 이 파이프라인에서
# 쓰지 않으므로 제외한다.
[tool.setuptools]
py-modules = ["ftp2str", "str2tle", "main", "candidate_search", "motion", "evaluate"]